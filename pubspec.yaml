name: syncra_arg
description: "Syncra Arg - La evolución digital de la nómina argentina. Gestión contable híbrida local/nube."
publish_to: 'none'

version: 2.0.5+105

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  pdf: ^3.10.7
  path_provider: ^2.1.2
  image_picker: ^1.0.7
  open_file: ^3.5.1
  share_plus: ^10.1.4

  shared_preferences: ^2.2.2
  http: ^1.2.1
  intl: ^0.20.2
  table_calendar: ^3.0.9
  url_launcher: ^6.2.5
  decimal: ^3.0.1

  # Escaneo de recibos docente: OCR on-device + QR
  google_mlkit_text_recognition: ^0.15.0
  mobile_scanner: ^7.1.4
  
  # OCR para web - Tesseract.js
  flutter_tesseract_ocr: ^0.4.30

  # Capa híbrida local/nube (Se eliminó realtime_client redundante)
  supabase_flutter: ^2.8.0
  connectivity_plus: ^7.0.0

  # Sprint 2: Gráficos y reportes
  fl_chart: ^0.68.0  # Gráficos profesionales
  excel: ^4.0.3      # Exportar Excel

  # Google Play Billing para suscripciones (Play Store)
  in_app_purchase: ^3.2.3
  collection: ^1.18.0
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  
  # Estrategia de URLs para web
  url_strategy: ^0.2.0
  printing: ^5.14.2
  provider: ^6.1.1 # Gestión de estado para temas
  file_picker: ^10.3.10
  google_fonts: ^8.0.1
  google_sign_in: ^6.2.1
  flutter_dotenv: ^6.0.0
  qr_flutter: ^4.1.0
  image: ^4.3.0
  lottie: ^3.3.0
  uuid: ^4.5.3
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.1
  isar_generator: 3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0D1B2A"
  fullscreen: true
  android: true
  ios: true
  web: true
  android_12:
    color: "#0D1B2A"
  color_dark: "#0D1B2A"
  android_12_dark:
    color_dark: "#0D1B2A"
