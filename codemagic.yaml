# codemagic.yaml para Syncra Arg
workflows:
  android-build:
    name: Syncra Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_ROOT: /Users/builder/programs/flutter
      groups:
        - google_play # Opcional: para las keys de firmado si las tenés
    triggering:
      events:
        - push
      watched_branches:
        - main
    scripts:
      - name: Instalar SDK Android y NDK
        script: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;26.1.10909125"
      - name: Limpieza profunda y dependencias
        script: | 
          flutter pub cache clean
          flutter pub get
      - name: Flutter doctor
        script: |
          flutter doctor -v
      - name: Build Android App Bundle (Release)
        script: | 
          flutter build appbundle --release --no-pub --verbose
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - TU_EMAIL_ACA@gmail.com # Poné tu mail para recibir el APK
