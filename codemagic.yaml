# codemagic.yaml para Syncra Arg
workflows:
  android-build:
    name: Syncra Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_ROOT: /Users/builder/programs/flutter
        KEYSTORE_PASSWORD: $FNC_KEYSTORE_PASSWORD
        KEY_PASSWORD: $FNC_KEY_PASSWORD
        KEY_ALIAS: $FNC_KEY_ALIAS
      android_signing:
        - keystore_reference: syncra_prod.jks
          keystore_password: $KEYSTORE_PASSWORD
          key_alias: $KEY_ALIAS
          key_password: $KEY_PASSWORD
      groups:
        - google_play # Opcional: para las keys de firmado si las tenés
    triggering:
      events:
        - push
      watched_branches:
        - main
    scripts:
      - name: Instalar SDK Android y NDK
        script: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Limpieza profunda y dependencias
        script: | 
          flutter pub cache clean
          flutter pub get
      - name: Flutter doctor
        script: |
          flutter doctor -v
      - name: Mapear variables de firmado
        script: |
          export KEYSTORE_PASSWORD="${FNC_KEYSTORE_PASSWORD:-$KEYSTORE_PASSWORD}"
          export KEY_PASSWORD="${FNC_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          export KEY_ALIAS="${FNC_KEY_ALIAS:-upload}"
      - name: Diagnóstico de firmado
        script: |
          echo "KEYSTORE_PASSWORD set: ${KEYSTORE_PASSWORD:+yes}"
          echo "KEY_PASSWORD set: ${KEY_PASSWORD:+yes}"
          echo "KEY_ALIAS: ${KEY_ALIAS}"
          echo "Keystores en /Users/builder/.keystores:"
          ls -la /Users/builder/.keystores || true
          if [ -f /Users/builder/.keystores/syncra_prod.jks ]; then
            keytool -list -keystore /Users/builder/.keystores/syncra_prod.jks -storepass "$KEYSTORE_PASSWORD" | head -n 20
            keytool -list -v -keystore /Users/builder/.keystores/syncra_prod.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "Alias name" || true
            keytool -list -v -keystore /Users/builder/.keystores/syncra_prod.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "${KEY_ALIAS:-upload}" | grep -i "Entry type" || true
          else
            echo "No existe /Users/builder/.keystores/syncra_prod.jks"
          fi
      - name: Build Android App Bundle (Release)
        script: | 
          # Usamos los valores definidos en pubspec.yaml (2.0.0+100) para evitar conflictos
          flutter build appbundle --release --no-pub --verbose
      - name: Prueba de firmado manual
        script: |
          if [ -f /Users/builder/.keystores/syncra_prod.jks ]; then
            android-app-bundle sign --verbose --bundle build/app/outputs/bundle/release/app-release.aab --ks /Users/builder/.keystores/syncra_prod.jks --ks-pass @env:KEYSTORE_PASSWORD --ks-key-alias "${KEY_ALIAS:-upload}" --key-pass @env:KEY_PASSWORD || true
          else
            echo "No se puede firmar: no existe el keystore"
          fi
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - TU_EMAIL_ACA@gmail.com # Poné tu mail para recibir el APK
