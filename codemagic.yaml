# codemagic.yaml para Syncra Arg
workflows:
  android-build:
    name: Syncra Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        FLUTTER_ROOT: /Users/builder/programs/flutter
        KEYSTORE_PASSWORD: $FNC_KEYSTORE_PASSWORD
        KEY_PASSWORD: $FNC_KEY_PASSWORD
        KEY_ALIAS: $FNC_KEY_ALIAS
      android_signing:
        - keystore_reference: syncra_prod.jks
          keystore_password: $KEYSTORE_PASSWORD
          key_alias: $KEY_ALIAS
          key_password: $KEY_PASSWORD
      groups:
        - google_play # Opcional: para las keys de firmado si las tenés
    triggering:
      events:
        - push
      watched_branches:
        - main
    scripts:
      - name: Instalar SDK Android y NDK
        script: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Limpieza profunda y dependencias
        script: | 
          flutter pub cache clean
          flutter pub get
      - name: Flutter doctor
        script: |
          flutter doctor -v
      - name: Mapear variables de firmado
        script: |
          export KEYSTORE_PASSWORD="$FNC_KEYSTORE_PASSWORD"
          export KEY_PASSWORD="$FNC_KEY_PASSWORD"
          export KEY_ALIAS="${FNC_KEY_ALIAS:-upload}"
      - name: Build Android App Bundle (Release)
        script: | 
          flutter build appbundle --release --no-pub --verbose
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - TU_EMAIL_ACA@gmail.com # Poné tu mail para recibir el APK
